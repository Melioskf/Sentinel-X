name: Bug report
description: Report a reproducible problem in Sentinel-X.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before opening a new report. Do not include secrets, private keys, tokens, or personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
      placeholder: |
        1. Start the backend...
        2. Open...
        3. Perform...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node version, Python version, and relevant deployment context.
      placeholder: Ubuntu 24.04 / Node 20 / Python 3.12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Redact tokens, keys, wallet secrets, credentials, and personal data before posting.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context
